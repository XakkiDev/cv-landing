name: WebGL scroll check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the scroll with software WebGL
        run: node scripts/check-webgl.mjs
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-frames-${{ github.run_id }}
          path: |
            test-results/*.png
            test-results/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-video-${{ github.run_id }}
          path: test-results/*.webm
          if-no-files-found: warn
          retention-days: 7
